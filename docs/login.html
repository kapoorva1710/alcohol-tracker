<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alcohol Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fa-solid fa-wine-glass-empty"></i>
            </div>
            <h1>Alcohol Tracker</h1>
            <p class="auth-subtitle">Sign in to your account</p>

            <div id="error-msg" class="alert alert-error" style="display:none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>Invalid username or password</span>
            </div>

            <div id="success-msg" class="alert alert-success" style="display:none;">
                <i class="fa-solid fa-circle-check"></i>
                <span>Account created! Please log in.</span>
            </div>

            <form action="/api/auth/login" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="primary-btn auth-btn">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </p>
        </div>
    </div>

    <script>
        // Show error/success messages from URL params
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'true') {
            document.getElementById('error-msg').style.display = 'flex';
        }
        if (params.get('logout') === 'true') {
            document.getElementById('success-msg').querySelector('span').textContent = 'You have been logged out.';
            document.getElementById('success-msg').style.display = 'flex';
        }
        if (params.get('registered') === 'true') {
            document.getElementById('success-msg').style.display = 'flex';
        }
    </script>
</body>
</html>
