<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Alcohol Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-wine-glass-empty"></i>
            <span>Alcohol Tracker</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
            <li><a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a></li>
            <li><a href="reports.html" class="active"><i class="fa-solid fa-chart-bar"></i> Reports</a></li>
        </ul>
        <div class="nav-user">
            <span id="nav-username"><i class="fa-solid fa-user"></i> User</span>
            <a href="/api/auth/logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="content-container">
            <h1 class="page-title">Reports & Analytics</h1>

            <!-- Stats Summary -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(0,196,154,0.1); color: #00c49a;">
                        <i class="fa-solid fa-wine-glass"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="total-all-time">0</span>
                        <span class="stat-label">Total Drinks</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(99,102,241,0.1); color: #6366f1;">
                        <i class="fa-solid fa-calculator"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="avg-per-day">0</span>
                        <span class="stat-label">Avg / Day</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(249,115,22,0.1); color: #f97316;">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="most-common">-</span>
                        <span class="stat-label">Most Common</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(236,72,153,0.1); color: #ec4899;">
                        <i class="fa-solid fa-fire"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="heaviest-day">-</span>
                        <span class="stat-label">Heaviest Day</span>
                    </div>
                </div>
            </div>

            <!-- Weekly Chart -->
            <div class="card chart-card">
                <div class="card-header">
                    <h2>This Week</h2>
                </div>
                <div class="report-chart-wrapper">
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>

            <!-- Monthly Chart -->
            <div class="card chart-card">
                <div class="card-header">
                    <h2>This Month</h2>
                </div>
                <div class="report-chart-wrapper">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="js/reports.js"></script>
</body>
</html>
