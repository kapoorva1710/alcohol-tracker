<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Alcohol Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-wine-glass-empty"></i>
            <span>Alcohol Tracker</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
            <li><a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a></li>
            <li><a href="reports.html"><i class="fa-solid fa-chart-bar"></i> Reports</a></li>
        </ul>
        <div class="nav-user">
            <span id="nav-username"><i class="fa-solid fa-user"></i> User</span>
            <a href="/api/auth/logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="app-container">
            <!-- Date Scroller -->
            <div class="date-scroller" id="date-scroller">
                <!-- Dynamically populated -->
            </div>

            <!-- Main Ring Card -->
            <section class="card hero-card">
                <div class="card-header">
                    <h2>Alcohol Consumption</h2>
                    <div id="settings-btn" class="icon-btn"><i class="fa-solid fa-gear"></i></div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="consumptionChart"></canvas>
                    <div class="chart-center-text">
                        <span id="total-drinks" class="large-value">0</span>
                        <span class="unit-label">Drinks</span>
                    </div>
                </div>
                <p id="status-message" class="status-message">You are within your weekly goal.</p>
            </section>

            <!-- Manual Entry Card -->
            <section class="card action-card">
                <div class="card-header">
                    <h2>Add a Drink</h2>
                    <i class="fa-solid fa-plus header-icon"></i>
                </div>
                <form id="drink-form">
                    <div class="form-group">
                        <input type="text" id="beverageName" placeholder="What did you drink?" required>
                    </div>
                    <div class="input-row">
                        <input type="number" id="quantity" step="0.5" min="0.5" placeholder="Qty" required>
                        <input type="text" id="notes" placeholder="Notes (optional)">
                    </div>
                    <button type="submit" class="primary-btn">
                        <i class="fa-solid fa-plus"></i> Save Drink
                    </button>
                </form>
            </section>

            <!-- Recent Logs Card -->
            <section class="card history-card">
                <div class="card-header">
                    <h2>Recent Logs</h2>
                    <a href="history.html" class="view-all">View all <i class="fa-solid fa-arrow-right"></i></a>
                </div>
                <ul id="log-list" class="log-list">
                    <!-- Dynamic Items -->
                </ul>
                <p id="empty-logs" class="empty-state" style="display:none;">
                    <i class="fa-solid fa-glass-water"></i><br>No drinks logged yet today.
                </p>
            </section>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2><i class="fa-solid fa-gear"></i> Settings</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label for="weeklyGoalInput">Weekly Goal (Standard Drinks)</label>
                    <input type="number" id="weeklyGoalInput" step="0.5" min="1" required>
                </div>
                <button type="submit" class="primary-btn">Save Settings</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
